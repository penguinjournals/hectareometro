<!DOCTYPE html>
<html lang=es>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link href='/css/style.css' rel='stylesheet' type='text/css'>
<style>
body { margin: 0; padding: 8px; text-align: center; }
#money-headline { font-size: 17px; margin: 4px auto; }
.money-bar { margin: 24px auto 4px; }

.money-picto { margin: 6px auto; }
.money-count { font-size: 16px; margin: 6px 0 2px; }
.money-legend { font-size: 12px; margin-bottom: 4px; }

<script>var PAGE_LANG = (window.location.search.indexOf('hl=en') !== -1) ? 'en' : 'es';</script>

</head>

<p id="money-headline"></p>
<div id="money-bar"></div>
<p id="money-bar-caption"></p>

<p id="money-time-count" class="money-count"></p>
<p id="money-time-legend" class="money-legend"></p>
<div id="money-obj-picto" class="money-picto" role="img"></div>
