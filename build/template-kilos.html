<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
{{HEAD_COMMON}}
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="David González Diez">

<!-- Open Graph data -->
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
{{OG_IMAGE_TAGS}}
<meta property="og:locale" content="{{OG_LOCALE}}" />

<!-- Structured data (schema.org) -->
<script type="application/ld+json">
{{JSON_LD}}
</script>

<script>var PAGE_LANG = '{{PAGE_LANG}}'; var PRESET_KILOS = {{K}};</script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script src="/js/hectareas-utils.js"></script>
<script src="/js/liters-data.js"></script>
<script src="/js/kilos-data.js"></script>
<script src="/js/kilos.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4477095176837087" crossorigin="anonymous"></script>
</head>
<body data-section="{{SECTION}}">
{{HEADER}}
<main>
<section class="hero hero-nomap">
  <div class="wrap">
    <div class="hero-head">
      {{BREADCRUMB}}
      <h1 class="ans">{{H1}}</h1>
      {{ARTICLE_DATE}}
      <p class="sub">{{HERO_SUB}}</p>
      <div id="litros-tool">
        <div id="litros-panel">
          <label for="kilos">{{KILO_TOOL_PRE}}</label>
          <input type="text" id="kilos" class="customizable-parameter" inputmode="decimal" autocomplete="off">
          <select id="kilos-unit" aria-label="{{KILO_ARIA_UNIT}}">
            {{KILO_UNIT_OPTIONS}}
          </select>
          <label for="kilos">?</label>
          <div id="equivalences" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div class="hero-visual">
      <div class="picto-stage">
        <div id="pictogram" role="img"></div>
        <p id="picto-count" aria-live="polite"></p>
        <p id="picto-legend"></p>
        <p id="picto-unit-row">
          <label for="picto-unit">{{LITER_SEE}}</label>
          <select id="picto-unit" aria-label="{{LITER_ARIA_DRAW}}"></select>
        </p>
        <p id="kilo-phrase"></p>
        <p id="picto-download-row"><a href="#" id="picto-download">{{ICON_DOWNLOAD}} {{LITER_DOWNLOAD}}</a></p>
      </div>
    </div>
    <div class="hero-more">
      <h2 class="eyebrow">{{RELATED_HEADING}}</h2>
      <ul class="related-links">
{{RELATED_LINKS}}
      </ul>
{{SHARE_BLOCK}}
    </div>
  </div>
</section>
<div class="wrap">
  <div class="prose section">
{{INTRO}}
{{FAQ_BLOCK}}
  </div>
{{RELATED_ARTICLES_BLOCK}}
{{LENSES_BLOCK}}
</div>
</main>
{{FOOTER}}
</body>
</html>
